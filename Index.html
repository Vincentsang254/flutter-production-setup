<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flutter Dev Cheatsheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      color: #facc15;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      position: relative;
    }

    .command {
      color: #22c55e;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .desc {
      color: #94a3b8;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #38bdf8;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .copy-btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <h1>🚀 Flutter Dev Cheatsheet</h1>
  <input type="text" id="search" placeholder="Search commands..." />

  <div id="docs"></div>

  <script>
    const flutterDocs = [

      // ===== SETUP =====
      {
        category: "Setup",
        title: "Generate Keystore",
        command: "keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload",
        desc: "Create keystore for signing"
      },
      {
        category: "Setup",
        title: "Key Properties File",
        command: "android/key.properties",
        desc: "Create file for storing credentials"
      },
      {
        category: "Setup",
        title: "Key Properties Example",
        command: `storePassword=your-password
keyPassword=your-password
keyAlias=upload
storeFile=upload-keystore.jks`,
        desc: "Used by Gradle for signing"
      },
      {
        category: "Setup",
        title: "Place Keystore File",
        command: "android/app/upload-keystore.jks",
        desc: "Move keystore into app folder"
      },

      // ===== SIGNING (KTS) =====
      {
        category: "Signing",
        title: "Import Properties (KTS)",
        command: `import java.util.Properties
import java.io.FileInputStream`,
        desc: "Add at top of build.gradle.kts"
      },
      {
        category: "Signing",
        title: "Load key.properties (KTS)",
        command: `val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(FileInputStream(keystorePropertiesFile))
}`,
        desc: "Load credentials before android block"
      },
      {
        category: "Signing",
        title: "Signing Config (KTS)",
        command: `signingConfigs {
    create("release") {
        keyAlias = keystoreProperties["keyAlias"] as String
        keyPassword = keystoreProperties["keyPassword"] as String
        storeFile = file(keystoreProperties["storeFile"] as String)
        storePassword = keystoreProperties["storePassword"] as String
    }
}`,
        desc: "Configure release signing"
      },
      {
        category: "Signing",
        title: "Release Build Config (KTS)",
        command: `buildTypes {
    getByName("release") {
        signingConfig = signingConfigs.getByName("release")
        isMinifyEnabled = true
        isShrinkResources = true
    }
}`,
        desc: "Enable optimized release build"
      },

      // ===== BUILD =====
      {
        category: "Build",
        title: "Build APK",
        command: "flutter build apk --release",
        desc: "Generate APK"
      },
      {
        category: "Build",
        title: "Build App Bundle",
        command: "flutter build appbundle",
        desc: "Recommended for Play Store"
      },
      {
        category: "Build",
        title: "Clean Project",
        command: "flutter clean",
        desc: "Clear cache"
      },
      {
        category: "Build",
        title: "Get Packages",
        command: "flutter pub get",
        desc: "Install dependencies"
      },

      // ===== BRANDING =====
      {
        category: "Branding",
        title: "Set App Name",
        command: 'flutter pub run rename setAppName --targets ios,android --value "YourAppName"',
        desc: "Change app name"
      },
      {
        category: "Branding",
        title: "Set Bundle ID",
        command: 'flutter pub run rename setBundleId --targets ios,android --value "com.yourname.app"',
        desc: "Set package name"
      },
      {
        category: "Branding",
        title: "Generate Launcher Icons",
        command: "flutter pub run flutter_launcher_icons:main",
        desc: "Generate icons"
      },
      {
        category: "Branding",
        title: "Create Splash Screen",
        command: "dart run flutter_native_splash:create",
        desc: "Generate splash screen"
      },
      {
        category: "Branding",
        title: "Remove Splash Screen",
        command: "dart run flutter_native_splash:remove",
        desc: "Remove splash"
      },

      // ===== WORKFLOW =====
      {
        category: "Workflow",
        title: "Full Setup (Icons + Splash)",
        command: `flutter pub get
flutter pub run flutter_launcher_icons:main
dart run flutter_native_splash:create
flutter clean
flutter run`,
        desc: "Run everything at once"
      },

      // ===== TOOLS =====
      {
        category: "Tools",
        title: "Doctor Check",
        command: "flutter doctor",
        desc: "Check setup"
      },
      {
        category: "Tools",
        title: "Devices",
        command: "flutter devices",
        desc: "List devices"
      },
      {
        category: "Tools",
        title: "Run App",
        command: "flutter run",
        desc: "Run on device"
      }
    ];

    const docsContainer = document.getElementById("docs");
    const searchInput = document.getElementById("search");

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text);
      btn.innerText = "Copied!";
      setTimeout(() => (btn.innerText = "Copy"), 1500);
    }

    function renderDocs(filter = "") {
      docsContainer.innerHTML = "";
      const grouped = {};

      flutterDocs.forEach(doc => {
        if (
          doc.title.toLowerCase().includes(filter.toLowerCase()) ||
          doc.command.toLowerCase().includes(filter.toLowerCase())
        ) {
          if (!grouped[doc.category]) grouped[doc.category] = [];
          grouped[doc.category].push(doc);
        }
      });

      for (let category in grouped) {
        const section = document.createElement("div");
        section.className = "section";
        section.innerHTML = `<h2>${category}</h2>`;

        grouped[category].forEach(doc => {
          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
            <button class="copy-btn">Copy</button>
            <h3>${doc.title}</h3>
            <p class="command">${doc.command}</p>
            <p class="desc">${doc.desc}</p>
          `;

          div.querySelector(".copy-btn").onclick = (e) =>
            copyToClipboard(doc.command, e.target);

          section.appendChild(div);
        });

        docsContainer.appendChild(section);
      }
    }

    searchInput.addEventListener("input", (e) => {
      renderDocs(e.target.value);
    });

    renderDocs();
  </script>

</body>
</html>
